<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom of HTML & Java Script</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: rgb(247, 248, 248);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .top-bar{
            background-color: rgb(147, 242, 155);
            display: flex;
            justify-content: space-between;
            padding: 10px;
        }
        .navigation-bar{
            display: flex;
            justify-content: space-between;
            margin: 10px;
        }
        li{
            list-style: none;
            margin: 0 10px;
            color: rgb(3, 50, 3);
        }
        .logo{
            font-size: 2rem;
            font-weight:bolder;
        }
        .logo span{
            color: red;
        }
        .search-box{
            background-color: white;
            height: 40px;
            padding: 5px;
            width: 250px;
            border-radius: 10px;
        }
        input{
            font-size: 1rem;
            margin: 5px;
            border: none;
        }
        input:focus {
            outline: none;
            border: none;
        }
        .login-btn, .Signup-btn{
            background-color: rgb(3, 50, 3);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo">Code<span>R</span></div>
        <nav class="navigation-bar">
            <li>Home</li>
            <li>About</li>
            <li>contact</li>
        </nav>
        <div class="search-box">
            <input type="text" placeholder="Search...">
        </div>
        <div class="login-signup">
            <button class="login-btn" onclick="login()">Login</button>
            <button class="Signup-btn">Signup</button>
        </div>
    </header>
    <script>
        let userLogin = true;
        let loginUser = document.querySelector('.login-btn');
        let SignupUser = document.querySelector('.Signup-btn');
        function login(){
                userLogin = true;

                loginUser.innerText = "Logout";   // change text only
                loginUser.setAttribute("onclick", "logout()");

                SignupUser.style.display = "none";
    
        }

        function logout(){
            userLogin = false;

            loginUser.innerText = "Login";   // reset back
            loginUser.setAttribute("onclick", "login()");

            SignupUser.style.display = "flex";
        }
    </script>
</body>
</html>
